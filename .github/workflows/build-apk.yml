name: Build & Publish Release APK (Captions Studio v-beta-0)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag'
        required: false
        default: 'v-beta-0'

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            set +o pipefail
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          fi

      - name: Prepare release signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/release-upload.jks"
          rm -f "$KEYSTORE_FILE"

          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_FILE"
            STORE_PASS="$RELEASE_STORE_PASSWORD"
            KEY_PASS="$RELEASE_KEY_PASSWORD"
            echo "Using repository release signing keystore secret."
          else
            echo "Release signing secrets not set; generating a valid PKCS12 release keystore (alias: upload)..."
            STORE_PASS="captions-studio-beta-0"
            KEY_PASS="captions-studio-beta-0"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -storepass "$STORE_PASS" \
              -alias upload \
              -keypass "$KEY_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Captions Studio v-beta-0,O=Captions Studio,C=US"
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build signed Release APK via github-release.gradle.kts
        run: gradle --init-script github-release.gradle.kts :app:buildGitHubReleaseApk --no-daemon

      - name: Upload Release APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Captions-Studio-v-beta-0-release-apk
          path: |
            release-dist/Captions-Studio-v-beta-0-release.apk
            release-dist/Captions-Studio-v-beta-0-release.apk.sha256
          if-no-files-found: error

      - name: Determine release tag
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="v-beta-0"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Captions Studio ${{ steps.release_meta.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: |
            release-dist/Captions-Studio-v-beta-0-release.apk
            release-dist/Captions-Studio-v-beta-0-release.apk.sha256
