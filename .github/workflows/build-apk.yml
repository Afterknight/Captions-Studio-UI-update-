name: Build & Publish Release APK (Caption Studio v-beta-0.9)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            set +o pipefail
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          fi

      - name: Decode optional release keystore secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            KS_FILE="${{ github.workspace }}/release-keystore.jks"
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KS_FILE"
            echo "KEYSTORE_FILE=$KS_FILE" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${KEY_ALIAS:-upload}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using repository release keystore secret."
          else
            echo "Release keystore secrets not set; Gradle will fall back to debug signing so the APK installs cleanly on devices."
          fi

      - name: Set up Gradle & cache dependencies
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build installable Release APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --init-script github-release.gradle.kts assembleRelease --no-daemon
          else
            gradle --init-script github-release.gradle.kts assembleRelease --no-daemon
          fi

      - name: Rename signed Release APK
        run: |
          RELEASE_DIR="app/build/outputs/apk/release"
          SIGNED_APK="$RELEASE_DIR/app-release.apk"
          TARGET_APK="$RELEASE_DIR/CaptionStudio-v-beta-0.9.apk"
          if [ ! -f "$SIGNED_APK" ]; then
            echo "Expected signed release APK at $SIGNED_APK was not found. Listing $RELEASE_DIR:"
            ls -la "$RELEASE_DIR" || true
            exit 1
          fi
          cp -f "$SIGNED_APK" "$TARGET_APK"
          ls -lh "$TARGET_APK"

      - name: Upload Release APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaptionStudio-v-beta-0.9
          path: app/build/outputs/apk/release/CaptionStudio-v-beta-0.9.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases (v-beta-0.9)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v-beta-0.9
          name: Caption Studio v-beta-0.9
          prerelease: true
          make_latest: true
          generate_release_notes: true
          files: app/build/outputs/apk/release/CaptionStudio-v-beta-0.9.apk
